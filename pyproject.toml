[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-desktop"
version = "0.1.0"
description = "An inspectable Python desktop voice pipeline"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
voice-agent = "voice_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_agent*"]
